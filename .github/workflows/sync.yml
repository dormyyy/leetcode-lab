name: Sync LeetCode progress

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'leetcode.json'
      - 'problems/**'
      - 'browser-sync/**'
      - 'tools/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: leetcode-progress
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source commit belongs to dormyyy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/commits/$(git rev-parse HEAD)"
          --jq 'if .author.login == "dormyyy" and .committer.login == "dormyyy"
          then "Author and committer: dormyyy"
          else error("Commit must belong to dormyyy") end'
      - name: Read public profile and update the journal
        run: |
          python tools/leetcode.py import-browser
          python tools/leetcode.py sync
          python tools/leetcode.py check
      - name: Publish changed counters as dormyyy
        run: |
          git config user.name dormyyy
          git config user.email 82229543+dormyyy@users.noreply.github.com
          git add README.md progress/leetcode.json
          git add -- problems
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync accepted solutions and LeetCode progress"
          git push origin HEAD:main
